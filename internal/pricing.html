<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Stitchify Pro Pricing</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Private pricing page. Dark-only by design, like the public site. The pricing itself is
       AES-GCM encrypted below and only exists in readable form after the passphrase is entered.
       Layout: lock card centred -> after unlock, one column: plans row, add-ons table, bundle,
       good to know. */
    :root {
      color-scheme: dark;
      --primary: #ff7a18;
      --primary-2: #ff9a3c;
      --teal: #2dd4bf;
      --bg: #14100c;
      --card: rgba(30, 24, 19, 0.62);
      --card-2: rgba(42, 33, 25, 0.7);
      --border: rgba(255, 255, 255, 0.10);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.62);
      --faint: rgba(255, 255, 255, 0.40);
      --ok: #34d399;
      --bad: #f87171;
      --display: 'Fira Code', ui-monospace, Consolas, monospace;
      --body: 'Fira Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--body);
      color: var(--text);
      line-height: 1.5;
      background:
        radial-gradient(1100px 700px at 10% -10%, rgba(255, 122, 24, 0.14), transparent 55%),
        radial-gradient(900px 600px at 100% 0%, rgba(45, 212, 191, 0.10), transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
    h1, h2, h3 { text-wrap: balance; margin: 0; }
    .mono { font-family: var(--display); }
    .muted { color: var(--muted); }
    .eyebrow { font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); }
    .glass { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--primary-2); outline-offset: 2px; }

    /* ---- Lock ---- */
    .lock { min-height: 70vh; display: grid; place-items: center; }
    .lock-card { width: 100%; max-width: 420px; padding: 28px; display: grid; gap: 16px; }
    .lock-card img { width: 40px; height: 40px; }
    .lock-card h1 { font-family: var(--display); font-size: 1.35rem; color: var(--primary); }
    .lock-card form { display: grid; gap: 10px; }
    .lock-card input {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35); color: var(--text); font-family: var(--display); font-size: 1rem;
    }
    .btn {
      padding: 12px 18px; border-radius: 12px; border: 0; font-weight: 600;
      color: #1a1005; background: linear-gradient(135deg, var(--primary-2), var(--primary));
    }
    .btn[disabled] { opacity: 0.6; cursor: wait; }
    .err { color: var(--bad); font-size: 0.9rem; min-height: 1.3em; }

    /* ---- Desk ---- */
    .desk { display: grid; gap: 28px; }
    .head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
    .head h1 { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2rem); }
    .head h1 span { color: var(--primary); }
    .head .lockbtn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; }
    .note { padding: 14px 16px; color: var(--muted); max-width: 72ch; }

    .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.25); }
    .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 9px; font-weight: 500; }
    .seg button[aria-pressed="true"] { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,154,60,.45); }

    section { display: grid; gap: 14px; }
    section > h2 { font-size: 1.15rem; }

    .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .plan { padding: 20px; display: grid; gap: 12px; align-content: start; }
    .plan.feature { border-color: rgba(255, 154, 60, 0.55); }
    .plan h3 { font-family: var(--display); font-size: 1.05rem; color: var(--primary-2); }
    .price { font-family: var(--display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .price small { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
    .plan .who { color: var(--muted); font-size: 0.92rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; }
    .plan li { display: flex; gap: 8px; }
    .plan li.no { color: var(--faint); }
    .plan li::before { content: "✓"; color: var(--ok); font-weight: 700; }
    .plan li.no::before { content: "–"; color: var(--faint); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 680px; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
    td.num { font-family: var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--primary-2); }
    td .sub { display: block; color: var(--muted); font-size: 0.82rem; }
    tr:last-child td { border-bottom: 0; }

    .bundle { padding: 20px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between; border-color: rgba(45, 212, 191, 0.45); }
    .bundle h3 { font-family: var(--display); color: var(--teal); }
    .bundle .price s { color: var(--faint); font-size: 1rem; font-weight: 500; margin-left: 8px; }


    ul.todo { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; max-width: 80ch; color: var(--muted); }
    .foot { color: var(--faint); font-size: 0.8rem; }

    @media (max-width: 860px) {
      .plans { grid-template-columns: minmax(0, 1fr); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .desk { animation: rise .35s ease-out both; }
      @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="lock" id="lock">
      <div class="lock-card glass">
        <img src="../assets/logo.svg" alt="" />
        <div>
          <div class="eyebrow">Private pricing</div>
          <h1>Stitchify Pro Pricing</h1>
          <p class="muted" style="margin:6px 0 0">Enter the passphrase you were given to view the plans.</p>
        </div>
        <form id="unlock-form" autocomplete="off">
          <input id="pass" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password" required />
          <button class="btn" id="unlock-btn" type="submit">Unlock</button>
          <div class="err" id="err" role="alert"></div>
        </form>
      </div>
    </div>

    <div class="desk" id="desk" hidden></div>
  </main>

  <script>
    // Encrypted with AES-256-GCM, key derived from the passphrase via PBKDF2-SHA256.
    // Regenerate with the owner's local encrypt script — never paste readable prices here.

"}/*END*/;

    const $ = (s) => document.querySelector(s);
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function decrypt(pass) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    $('#unlock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#unlock-btn');
      btn.disabled = true; btn.textContent = 'Unlocking…'; $('#err').textContent = '';
      try {
        if (!PAYLOAD) throw new Error('empty');
        render(await decrypt($('#pass').value));
        $('#pass').value = '';
        $('#lock').hidden = true; $('#desk').hidden = false;
      } catch {
        $('#err').textContent = 'Wrong passphrase. Check it and try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Unlock';
      }
    });

    let DATA = null, billing = 'monthly';
    const money = (n) => DATA.currency + Math.round(n).toLocaleString('en-PH');
    const per = { monthly: '/mo', yearly: '/yr' };

    function render(data) {
      DATA = data;
      try { billing = sessionStorage.getItem('pd-billing') === 'yearly' ? 'yearly' : 'monthly'; } catch {}
      const feat = (p) => data.features.map((f) => `<li class="${f[p.id] ? '' : 'no'}">${esc(f.name)}</li>`).join('');

      $('#desk').innerHTML = `
        <div class="head">
          <div>
            <div class="eyebrow">Plans &amp; add-ons</div>
            <h1>Stitchify Pro <span>pricing</span></h1>
          </div>
          <button class="lockbtn" id="relock" type="button">Lock</button>
        </div>
        <p class="note glass">${esc(data.intro)}</p>

        <section>
          <div class="head">
            <h2>Plans</h2>
            <div class="seg" role="group" aria-label="Billing">
              ${['monthly', 'yearly'].map((b) => `<button type="button" data-billing="${b}" aria-pressed="${b === billing}">${b[0].toUpperCase() + b.slice(1)}</button>`).join('')}
            </div>
          </div>
          <div class="plans">
            ${data.plans.map((p) => `
              <article class="plan glass ${p.id === 'premium' ? 'feature' : ''}">
                <h3>${esc(p.name)}</h3>
                <div class="price" data-plan="${p.id}"></div>
                <p class="who" style="margin:0">${esc(p.who)}</p>
                <div class="chips">
                  <span class="chip">${p.accounts} TikTok accounts</span>
                  <span class="chip">${p.seats} PC</span>
                </div>
                <ul>${feat(p)}</ul>
              </article>`).join('')}
          </div>
        </section>

        <section>
          <h2>Add-ons <span class="muted" style="font-weight:400;font-size:.9rem">— add to any plan where available</span></h2>
          <div class="table-wrap glass">
            <table>
              <thead><tr><th>Add-on</th><th>Monthly</th><th>Available on</th></tr></thead>
              <tbody>
                ${data.addons.map((a) => `<tr>
                  <td><b>${esc(a.name)}</b><span class="sub">${esc(a.detail)}</span></td>
                  <td class="num">+${money(a.monthly)}/mo</td>
                  <td>${esc(a.availability)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <section>
          <h2>Bundle</h2>
          ${data.bundles.map((b) => `
            <div class="bundle glass">
              <div style="display:grid;gap:4px;min-width:0">
                <h3>${esc(b.name)}</h3>
                <div class="muted">${esc(b.includes)}</div>
                <div class="chips"><span class="chip" style="color:var(--teal);border-color:rgba(45,212,191,.45)">${esc(b.tag)}</span></div>
              </div>
              <div class="price">${money(b.monthly)}<small>/mo</small><s>${money(b.compareAt)}</s></div>
            </div>`).join('')}
        </section>

        <section>
          <h2>Good to know</h2>
          <ul class="todo">${data.goodToKnow.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
        </section>

        <p class="foot">Prices in Philippine pesos. Questions? Ask us on Discord.</p>`;

      $('#desk').querySelectorAll('[data-billing]').forEach((b) => b.addEventListener('click', () => setBilling(b.dataset.billing)));
      $('#relock').addEventListener('click', () => { $('#desk').innerHTML = ''; DATA = null; $('#desk').hidden = true; $('#lock').hidden = false; $('#pass').focus(); });
      setBilling(billing);
    }

    function setBilling(b) {
      billing = b;
      try { sessionStorage.setItem('pd-billing', b); } catch {}
      document.querySelectorAll('[data-billing]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.billing === b)));
      DATA.plans.forEach((p) => {
        const el = document.querySelector(`.price[data-plan="${p.id}"]`);
        el.innerHTML = `${money(p[b])}<small>${per[b]}</small>`;
      });
    }

  </script>
</body>
</html>
