<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Stitchify Pro Pricing</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Private pricing page with a quote builder. Dark-only by design, like the public site. The
       prices are AES-GCM encrypted below and only exist in readable form after the passphrase.
       Layout: lock card centred -> after unlock: plan cards row, then a two-column quote builder
       (add-on checklist left, sticky summary + send form right), then bundle and notes. */
    :root {
      color-scheme: dark;
      --primary: #ff7a18;
      --primary-2: #ff9a3c;
      --teal: #2dd4bf;
      --bg: #14100c;
      --card: rgba(30, 24, 19, 0.62);
      --card-2: rgba(42, 33, 25, 0.7);
      --border: rgba(255, 255, 255, 0.10);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.62);
      --faint: rgba(255, 255, 255, 0.40);
      --ok: #34d399;
      --bad: #f87171;
      --display: 'Fira Code', ui-monospace, Consolas, monospace;
      --body: 'Fira Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--body); color: var(--text); line-height: 1.5; min-height: 100vh;
      background:
        radial-gradient(1100px 700px at 10% -10%, rgba(255, 122, 24, 0.14), transparent 55%),
        radial-gradient(900px 600px at 100% 0%, rgba(45, 212, 191, 0.10), transparent 50%),
        var(--bg);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
    h1, h2, h3 { text-wrap: balance; margin: 0; }
    .muted { color: var(--muted); }
    .eyebrow { font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); }
    .glass { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, label.addon:focus-within { outline: 2px solid var(--primary-2); outline-offset: 2px; }
    input, textarea { font: inherit; }

    .btn { padding: 12px 18px; border-radius: 12px; border: 0; font-weight: 600; color: #1a1005; background: linear-gradient(135deg, var(--primary-2), var(--primary)); }
    .btn[disabled] { opacity: 0.6; cursor: wait; }
    .err { color: var(--bad); font-size: 0.9rem; min-height: 1.3em; }

    /* ---- Lock ---- */
    .lock { min-height: 70vh; display: grid; place-items: center; }
    .lock-card { width: 100%; max-width: 420px; padding: 28px; display: grid; gap: 16px; }
    .lock-card img { width: 40px; height: 40px; }
    .lock-card h1 { font-family: var(--display); font-size: 1.35rem; color: var(--primary); }
    .lock-card form { display: grid; gap: 10px; }
    .text-in { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0, 0, 0, 0.35); color: var(--text); }
    .lock-card .text-in { font-family: var(--display); font-size: 1rem; }

    /* ---- Page ---- */
    .desk { display: grid; gap: 28px; }
    .head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
    .head h1 { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2rem); }
    .head h1 span { color: var(--primary); }
    .lockbtn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; }
    .note { padding: 14px 16px; color: var(--muted); max-width: 72ch; margin: 0; }
    section { display: grid; gap: 14px; }
    section > h2, .head h2 { font-size: 1.15rem; }
    .step { font-family: var(--display); color: var(--primary-2); margin-right: 6px; }

    .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,.25); }
    .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 9px; font-weight: 500; }
    .seg button[aria-pressed="true"] { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,154,60,.45); }

    .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .plan { padding: 20px; display: grid; gap: 12px; align-content: start; transition: border-color .15s, box-shadow .15s; }
    .plan.selected { border-color: rgba(255, 154, 60, 0.75); box-shadow: 0 0 0 1px rgba(255, 154, 60, 0.45), 0 12px 32px rgba(255, 122, 24, 0.14); }
    .plan h3 { font-family: var(--display); font-size: 1.05rem; color: var(--primary-2); }
    .price { font-family: var(--display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .price small { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
    .plan .who { color: var(--muted); font-size: 0.92rem; margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; }
    .plan li { display: flex; gap: 8px; }
    .plan li.no { color: var(--faint); }
    .plan li::before { content: "✓"; color: var(--ok); font-weight: 700; }
    .plan li.no::before { content: "–"; color: var(--faint); }
    .choose { margin-top: 4px; padding: 10px 14px; border-radius: 11px; font-weight: 600; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); }
    .plan.selected .choose { border-color: transparent; color: #1a1005; background: linear-gradient(135deg, var(--primary-2), var(--primary)); }

    .builder { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .addons { padding: 6px; display: grid; }
    label.addon { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px; border-radius: 12px; cursor: pointer; }
    label.addon + label.addon { border-top: 1px solid var(--border); border-top-left-radius: 0; border-top-right-radius: 0; }
    label.addon:hover { background: rgba(255,255,255,.03); }
    label.addon.off { cursor: not-allowed; opacity: .55; }
    label.addon input[type="checkbox"] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary); }
    .addon b { font-weight: 600; }
    .addon .sub { display: block; color: var(--muted); font-size: 0.84rem; }
    .addon .why { display: block; color: var(--teal); font-size: 0.78rem; margin-top: 2px; }
    .addon .amt { font-family: var(--display); color: var(--primary-2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
    .qty { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
    .qty button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,.3); color: var(--text); font-weight: 700; }
    .qty output { min-width: 2ch; text-align: center; font-family: var(--display); font-variant-numeric: tabular-nums; }

    .summary { padding: 18px; display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
    .lines { display: grid; gap: 6px; font-size: 0.9rem; }
    .line { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
    .line b { color: var(--text); font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .line.save b { color: var(--ok); }
    .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .total .big { font-family: var(--display); font-size: 1.9rem; font-weight: 700; color: var(--primary-2); font-variant-numeric: tabular-nums; }
    .summary form { display: grid; gap: 8px; }
    .summary label { font-size: 0.82rem; color: var(--muted); display: grid; gap: 4px; }
    .summary textarea { min-height: 70px; resize: vertical; }
    .sent { padding: 12px 14px; border-radius: 12px; background: rgba(52, 211, 153, .12); border: 1px solid rgba(52, 211, 153, .4); color: var(--text); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    .bundle { padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between; border-color: rgba(45, 212, 191, 0.45); }
    .bundle h3 { font-family: var(--display); color: var(--teal); }
    .bundle .price s { color: var(--faint); font-size: 1rem; font-weight: 500; margin-left: 8px; }
    ul.notes { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; max-width: 80ch; color: var(--muted); }
    .foot { color: var(--faint); font-size: 0.8rem; }

    @media (max-width: 860px) {
      .plans, .builder { grid-template-columns: minmax(0, 1fr); }
      .summary { position: static; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .desk { animation: rise .35s ease-out both; }
      @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <!-- Static copy of the quote form so Netlify Forms detects it at deploy time. The visible form is
       rendered after unlocking and submits these same field names. -->
  <form name="quote" netlify netlify-honeypot="bot-field" hidden>
    <input name="name" /><input name="contact" /><textarea name="message"></textarea>
    <input name="plan" /><input name="billing" /><input name="addons" /><input name="total" />
    <textarea name="summary"></textarea><input name="bot-field" />
  </form>

  <main class="wrap">
    <div class="lock" id="lock">
      <div class="lock-card glass">
        <img src="../assets/logo.svg" alt="" />
        <div>
          <div class="eyebrow">Private pricing</div>
          <h1>Stitchify Pro Pricing</h1>
          <p class="muted" style="margin:6px 0 0">Enter the passphrase you were given to view the plans.</p>
        </div>
        <form id="unlock-form" autocomplete="off">
          <input class="text-in" id="pass" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password" required />
          <button class="btn" id="unlock-btn" type="submit">Unlock</button>
          <div class="err" id="err" role="alert"></div>
        </form>
      </div>
    </div>

    <div class="desk" id="desk" hidden></div>
  </main>

  <script>

    const $ = (s) => document.querySelector(s);
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function decrypt(pass) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    $('#unlock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#unlock-btn');
      btn.disabled = true; btn.textContent = 'Unlocking…'; $('#err').textContent = '';
      try {
        if (!PAYLOAD) throw new Error('empty');
        render(await decrypt($('#pass').value));
        $('#pass').value = '';
        $('#lock').hidden = true; $('#desk').hidden = false;
      } catch {
        $('#err').textContent = 'Wrong passphrase. Check it and try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Unlock';
      }
    });

    // ---------- State ----------
    let DATA = null;
    const S = { plan: 'premium', billing: 'monthly', on: new Set(), qty: {} };
    const money = (n) => DATA.currency + Math.round(n).toLocaleString('en-PH');
    const per = { monthly: '/mo', yearly: '/yr' };
    const mult = () => (S.billing === 'yearly' ? 10 : 1);   // yearly = 10x monthly (2 months free)
    const plan = () => DATA.plans.find((p) => p.id === S.plan);

    // Can this add-on be chosen with the current plan and choices? Returns null if yes, or why not.
    function blocked(a) {
      if (a.includedIn && a.includedIn.includes(S.plan)) return 'Included in ' + plan().name;
      if (a.plans && !a.plans.includes(S.plan)) return 'Needs ' + a.plans.map((id) => DATA.plans.find((p) => p.id === id).name).join(' or ');
      if (a.requires && !S.on.has(a.requires)) return 'Needs ' + DATA.addons.find((x) => x.id === a.requires).name;
      return null;
    }

    // Drop anything the current plan no longer allows (repeat: removing one can block another).
    function prune() {
      let changed = true;
      while (changed) {
        changed = false;
        for (const a of DATA.addons) if (S.on.has(a.id) && blocked(a)) { S.on.delete(a.id); changed = true; }
      }
    }

    function quote() {
      const p = plan(), lines = [];
      let monthly = p.monthly;
      lines.push({ label: p.name + ' plan', amount: p.monthly });
      for (const a of DATA.addons) {
        if (!S.on.has(a.id)) continue;
        const q = a.qty ? (S.qty[a.id] || 1) : 1;
        lines.push({ label: a.name + (a.qty ? ' × ' + q : ''), amount: a.monthly * q });
        monthly += a.monthly * q;
      }
      let bundle = null;
      for (const b of DATA.bundles) {
        if (b.plan === S.plan && b.addons.every((id) => S.on.has(id))) {
          const full = p.monthly + b.addons.reduce((s, id) => s + DATA.addons.find((a) => a.id === id).monthly, 0);
          if (full > b.monthly) { bundle = { name: b.name, save: full - b.monthly }; monthly -= bundle.save; }
        }
      }
      return { lines, bundle, monthly, total: monthly * mult() };
    }

    // ---------- Render ----------
    function render(data) {
      DATA = data;
      S.plan = data.defaultPlan || data.plans[0].id;
      try { if (sessionStorage.getItem('pd-billing') === 'yearly') S.billing = 'yearly'; } catch {}
      const feat = (p) => data.features.map((f) => `<li class="${f[p.id] ? '' : 'no'}">${esc(f.name)}</li>`).join('');

      $('#desk').innerHTML = `
        <div class="head">
          <div>
            <div class="eyebrow">Plans &amp; add-ons</div>
            <h1>Stitchify Pro <span>pricing</span></h1>
          </div>
          <button class="lockbtn" id="relock" type="button">Lock</button>
        </div>
        <p class="note glass">${esc(data.intro)}</p>

        <section>
          <div class="head">
            <h2><span class="step">1</span>Choose your plan</h2>
            <div class="seg" role="group" aria-label="Billing">
              ${['monthly', 'yearly'].map((b) => `<button type="button" data-billing="${b}">${b === 'monthly' ? 'Monthly' : 'Yearly · 2 months free'}</button>`).join('')}
            </div>
          </div>
          <div class="plans">
            ${data.plans.map((p) => `
              <article class="plan glass" data-plan-card="${p.id}">
                <h3>${esc(p.name)}</h3>
                <div class="price" data-plan-price="${p.id}"></div>
                <p class="who">${esc(p.who)}</p>
                <div class="chips">
                  <span class="chip">${p.accounts} TikTok accounts</span>
                  <span class="chip">${p.seats} PC</span>
                </div>
                <ul>${feat(p)}</ul>
                <button type="button" class="choose" data-choose="${p.id}"></button>
              </article>`).join('')}
          </div>
        </section>

        <section>
          <h2><span class="step">2</span>Add what you need</h2>
          <div class="builder">
            <div class="addons glass" id="addons"></div>
            <aside class="summary glass" aria-live="polite">
              <div class="eyebrow">Your quote</div>
              <div class="lines" id="lines"></div>
              <div class="total"><span class="muted" id="total-label"></span><span class="big" id="total"></span></div>
              <div id="send-area">
                <form id="quote-form" novalidate>
                  <label>Your name<input class="text-in" id="q-name" name="name" autocomplete="name" required /></label>
                  <label>How can we reach you? (Messenger, Discord, email or phone)<input class="text-in" id="q-contact" name="contact" required /></label>
                  <label>Anything else? (optional)<textarea class="text-in" id="q-message" name="message"></textarea></label>
                  <div class="hp" aria-hidden="true"><label>Leave empty<input id="q-bot" name="bot-field" tabindex="-1" autocomplete="off" /></label></div>
                  <button class="btn" id="send-btn" type="submit">Send quote</button>
                  <div class="err" id="q-err" role="alert"></div>
                </form>
              </div>
            </aside>
          </div>
        </section>

        <section>
          <h2>Bundle</h2>
          ${data.bundles.map((b) => `
            <div class="bundle glass">
              <div style="display:grid;gap:4px;min-width:0">
                <h3>${esc(b.name)}</h3>
                <div class="muted">${esc(b.includes)}</div>
                <div class="chips"><span class="chip" style="color:var(--teal);border-color:rgba(45,212,191,.45)">${esc(b.tag)} · applied automatically</span></div>
              </div>
              <div class="price">${money(b.monthly)}<small>/mo</small><s>${money(b.compareAt)}</s></div>
            </div>`).join('')}
        </section>

        <section>
          <h2>Good to know</h2>
          <ul class="notes">${data.goodToKnow.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
        </section>

        <p class="foot">Prices in Philippine pesos. Questions? Ask us on Discord.</p>`;

      $('#desk').querySelectorAll('[data-billing]').forEach((b) => b.addEventListener('click', () => {
        S.billing = b.dataset.billing;
        try { sessionStorage.setItem('pd-billing', S.billing); } catch {}
        update();
      }));
      $('#desk').querySelectorAll('[data-choose]').forEach((b) => b.addEventListener('click', () => { S.plan = b.dataset.choose; prune(); update(); }));
      $('#relock').addEventListener('click', () => { $('#desk').innerHTML = ''; DATA = null; $('#desk').hidden = true; $('#lock').hidden = false; $('#pass').focus(); });
      $('#quote-form').addEventListener('submit', sendQuote);
      update();
    }

    function update() {
      document.querySelectorAll('[data-billing]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.billing === S.billing)));
      DATA.plans.forEach((p) => {
        document.querySelector(`[data-plan-price="${p.id}"]`).innerHTML = `${money(p[S.billing])}<small>${per[S.billing]}</small>`;
        const card = document.querySelector(`[data-plan-card="${p.id}"]`);
        card.classList.toggle('selected', p.id === S.plan);
        const btn = card.querySelector('[data-choose]');
        btn.textContent = p.id === S.plan ? 'Selected' : 'Choose ' + p.name;
        btn.setAttribute('aria-pressed', String(p.id === S.plan));
      });

      $('#addons').innerHTML = DATA.addons.map((a) => {
        const why = blocked(a), on = S.on.has(a.id), q = S.qty[a.id] || 1;
        const amt = why && why.startsWith('Included') ? 'Included' : '+' + money(a.monthly * (a.qty && on ? q : 1) * mult()) + per[S.billing];
        return `<label class="addon ${why ? 'off' : ''}">
          <input type="checkbox" data-addon="${a.id}" ${on ? 'checked' : ''} ${why ? 'disabled' : ''} />
          <span><b>${esc(a.name)}</b><span class="sub">${esc(a.detail)}</span>${why ? `<span class="why">${esc(why)}</span>` : ''}
            ${a.qty && on ? `<span class="qty"><button type="button" data-dec="${a.id}" aria-label="Fewer">−</button><output>${q}</output><button type="button" data-inc="${a.id}" aria-label="More">+</button></span>` : ''}
          </span>
          <span class="amt">${amt}</span>
        </label>`;
      }).join('');
      $('#addons').querySelectorAll('[data-addon]').forEach((c) => c.addEventListener('change', () => {
        if (c.checked) S.on.add(c.dataset.addon); else S.on.delete(c.dataset.addon);
        prune(); update();
      }));
      const step = (id, d) => {
        const a = DATA.addons.find((x) => x.id === id);
        S.qty[id] = Math.min(a.max || 99, Math.max(1, (S.qty[id] || 1) + d));
        update();
      };
      $('#addons').querySelectorAll('[data-inc]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); step(b.dataset.inc, 1); }));
      $('#addons').querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); step(b.dataset.dec, -1); }));

      const q = quote();
      $('#lines').innerHTML = q.lines.map((l) => `<div class="line"><span>${esc(l.label)}</span><b>${money(l.amount * mult())}</b></div>`).join('')
        + (q.bundle ? `<div class="line save"><span>${esc(q.bundle.name)} bundle</span><b>−${money(q.bundle.save * mult())}</b></div>` : '');
      $('#total-label').textContent = S.billing === 'yearly' ? 'Total per year' : 'Total per month';
      $('#total').textContent = money(q.total);
    }

    function summaryText(q) {
      const p = plan();
      return [
        `Plan: ${p.name} (${S.billing === 'yearly' ? 'Yearly' : 'Monthly'})`,
        ...q.lines.map((l) => `- ${l.label}: ${money(l.amount * mult())}`),
        ...(q.bundle ? [`- ${q.bundle.name} bundle: -${money(q.bundle.save * mult())}`] : []),
        `Total: ${money(q.total)}${per[S.billing]}`,
      ].join('\n');
    }

    async function sendQuote(e) {
      e.preventDefault();
      const name = $('#q-name').value.trim(), contact = $('#q-contact').value.trim();
      if (!name || !contact) { $('#q-err').textContent = 'Add your name and a way to reach you, then send.'; return; }
      const q = quote(), btn = $('#send-btn');
      btn.disabled = true; btn.textContent = 'Sending…'; $('#q-err').textContent = '';
      const body = new URLSearchParams({
        'form-name': 'quote', name, contact,
        message: $('#q-message').value.trim(),
        plan: plan().name, billing: S.billing,
        addons: DATA.addons.filter((a) => S.on.has(a.id)).map((a) => a.qty ? `${a.name} x${S.qty[a.id] || 1}` : a.name).join(', ') || 'None',
        total: money(q.total) + per[S.billing],
        summary: summaryText(q),
        'bot-field': $('#q-bot').value,
      });
      try {
        const res = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        $('#send-area').innerHTML = `<div class="sent">${esc(DATA.quote.thanks)}<br><span class="muted" style="font-size:.85rem">${esc(plan().name)} · ${esc(money(q.total) + per[S.billing])}</span></div>`;
      } catch {
        $('#q-err').textContent = DATA.quote.fail;
        btn.disabled = false; btn.textContent = 'Send quote';
      }
    }
  </script>
</body>
</html>
